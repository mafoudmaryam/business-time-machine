[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "btm-engine"
version = "0.1.0"
description = "Business Time Machine simulation engine (cafe template)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
]

[tool.setuptools.packages.find]
include = ["btm_engine*"]

[tool.setuptools.package-data]
btm_engine = ["data/*.json"]
